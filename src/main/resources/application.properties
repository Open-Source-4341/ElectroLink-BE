# Application
spring.application.name=electrolink-platform

# PostgreSQL
# Render supplies these values as environment variables. For local development,
# configure the same variables in the IDE or terminal before starting the app.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA
spring.jpa.database=postgresql
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.hampcoders.electrolink.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Render injects PORT automatically. The fallback keeps local execution on 8091.
server.address=0.0.0.0
server.port=${PORT:8091}

# CORS. Use a comma-separated list when more than one web frontend is deployed.
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Application information for documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:10}
